<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock flow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="topbar">
      <div class="brand">
        <img class="brand-icon" src="icons/icon32.png" alt="" width="28" height="28">
        <span class="brand-name">Unlock Flow</span>
      </div>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" type="button" title="Тёмная тема" aria-label="Тёмная тема">
          <svg id="theme-icon" class="theme-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="check-update" class="icon-btn" type="button" title="Проверить обновление" aria-label="Проверить обновление">
          <svg class="update-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
        <div class="lang" role="group" aria-label="Language">
          <button id="lang-ru" class="lang-btn" type="button">RU</button>
          <button id="lang-en" class="lang-btn" type="button">EN</button>
        </div>
      </div>
    </div>

    <h1 id="title">Flow и Playground</h1>
    <p class="intro" id="intro"></p>

    <div class="service-picker" role="group" aria-label="Сервис" id="service-picker">
      <button id="service-flow" class="service-choice" type="button" aria-pressed="true">Flow<span id="flow-caption">Видео</span></button>
      <button id="service-playground" class="service-choice" type="button" aria-pressed="false">Playground<span id="playground-caption">Игры</span></button>
    </div>

    <section>
      <label for="enabled">
        <span id="toggle-label">Unlock Flow</span>
        <div class="switch">
          <input id="enabled" type="checkbox" role="switch" disabled>
          <span class="switch-slider"></span>
        </div>
      </label>
      <p id="toggle-hint" class="toggle-hint"></p>
      <div class="status-row">
        <span id="status-dot" class="status-dot"></span>
        <p id="status" role="status"></p>
      </div>
    </section>

    <p id="service-hint" class="service-hint"></p>
    <div class="tabs">
      <button id="open" type="button" disabled></button>
      <button id="reload" class="secondary" type="button"></button>
    </div>

    <button id="pin-btn" class="tool-btn" type="button">
      <svg class="pin-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="17" x2="12" y2="22"></line>
        <path d="M5 17h14v-2l-2-2V5a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v8l-2 2v2z"></path>
        <line x1="9" y1="4" x2="15" y2="4"></line>
      </svg>
      <span id="pin-text">Закрепить вкладку Flow</span>
    </button>


    <p id="error" role="alert"></p>

    <a class="help" href="https://t.me/TotalC0de/483" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.138-1.294 3.785-1.518 3.973-1.546z"/>
      </svg>
      <span id="help-text"></span>
    </a>

    <footer>
      <button id="version-btn" class="link-btn" type="button" title="Проверить версию">v1.4.4</button> · <a href="https://t.me/TotalCodeAdmin" target="_blank" rel="noopener noreferrer">@TotalCodeAdmin</a>
    </footer>

    <!-- Version & Update Modal Dialog -->
    <div id="modal-overlay" class="modal-backdrop" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="modal-close" class="modal-close-btn" type="button" aria-label="Закрыть">&times;</button>
        <div id="modal-icon" class="modal-icon"></div>
        <h2 id="modal-title" class="modal-title"></h2>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
